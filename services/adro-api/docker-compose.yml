services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: adro
      POSTGRES_USER: adro
      POSTGRES_PASSWORD: adro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adro -d adro"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - adro-api-postgres:/var/lib/postgresql/data

volumes:
  adro-api-postgres:
