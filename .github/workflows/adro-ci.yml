name: Adro CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adro-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validation:
    name: Windows validation
    runs-on: windows-2022
    timeout-minutes: 60

    env:
      VSCODE_ARCH: x64
      npm_config_arch: x64
      npm_config_foreground_scripts: "true"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: Checkout Adro
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node build/npm/preinstall.ts
          npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type-check client
        run: npm run typecheck-client

      - name: Check architecture layers
        run: npm run valid-layers-check

      - name: Compile and test Adro Chat
        run: npm --prefix extensions/adro-chat run compile && npm --prefix extensions/adro-chat test

  adro-api:
    name: Adro API
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/adro-api

    steps:
      - name: Checkout Adro
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/adro-api/package-lock.json

      - name: Install, type-check, and test
        run: |
          npm ci
          npm run typecheck
          npm test
